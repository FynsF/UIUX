<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HelmKu – Penitipan Helm</title>
<style>
:root{--bg:#f4f5fb;--cd:#fff;--tx:#161a2e;--mu:#6b7191;--pr:#4338ca;--pl:#e8e7fb;--ac:#f59e0b;--bd:#e3e5f0;--ok:#16a34a;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1120;--cd:#1a1d33;--tx:#eef0ff;--mu:#9aa0c3;--pr:#818cf8;--pl:#272a52;--bd:#2c3050}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0}
*{box-sizing:border-box}body{background:var(--bg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx)}
button,input{font:inherit;color:inherit}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
#scr{flex:1;overflow-y:auto;padding:16px}
nav{display:flex;background:var(--cd);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;padding:10px 0;color:var(--mu);font-size:11px}nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--pr);font-weight:700}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:14px}.hd h2{flex:1;margin:0;font-size:18px}
.ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);cursor:pointer;font-size:18px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:var(--pr);color:#fff;font-weight:700;cursor:pointer;margin-top:10px}
.btn.sec{background:var(--pl);color:var(--pr)}.btn.dg{background:var(--er)}.btn:active{transform:scale(.98)}
.lk{background:none;border:0;color:var(--pr);font-weight:600;cursor:pointer;display:block;margin:12px auto;padding:4px}
.lk.dg{color:var(--er)}
.in{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);margin-top:8px}
.in:focus{outline:2px solid var(--pr)}.err{color:var(--er);font-size:12px;margin:4px 2px;min-height:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.mu{color:var(--mu)}.sm{font-size:12px}
.bdg{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#dcfce7;color:#166534}.bdg.a{background:#fef3c7;color:#92400e}.bdg.r{background:#fee2e2;color:#991b1b}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--cd);cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.hero{background:linear-gradient(135deg,var(--pr),#7c3aed);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.hero h1{margin:0 0 4px;font-size:22px}.sr{display:flex;gap:8px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px;color:var(--mu);cursor:pointer}
.mapv{position:relative;height:300px;border-radius:18px;overflow:hidden;background:#dbeafe;background-image:linear-gradient(#fff8 2px,transparent 2px),linear-gradient(90deg,#fff8 2px,transparent 2px);background-size:50px 50px;border:1px solid var(--bd)}
.pin{position:absolute;transform:translate(-50%,-100%);font-size:28px;cursor:pointer;filter:drop-shadow(0 2px 2px #0005);transition:.2s}.pin.on{font-size:36px}
.me{position:absolute;width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 8px #2563eb33;transform:translate(-50%,-50%)}
.fab{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px #0004;font-size:18px;cursor:pointer}
.qr{width:200px;height:200px;margin:8px auto;display:block;background:#fff;padding:8px;border-radius:12px;color:#111}
.ctr{text-align:center}.big{font-size:44px}.emp{text-align:center;padding:30px 10px}.emp .big{font-size:60px}
.tm{font-size:28px;font-weight:800;color:var(--er);text-align:center}
#mod{position:absolute;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}#mod.on{display:flex}
.sheet{background:var(--cd);width:100%;border-radius:22px 22px 0 0;padding:20px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:30;white-space:nowrap}#toast.on{opacity:1}
.cam{background:#111;color:#fff;border-radius:20px;height:330px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vf{width:210px;height:210px;border:3px solid #fff;border-radius:22px;position:relative;overflow:hidden}.vf i{position:absolute;left:0;right:0;height:3px;background:#22d3ee;box-shadow:0 0 12px #22d3ee;animation:sc 2s infinite alternate}
@keyframes sc{from{top:0}to{top:100%}}
.lock{font-size:90px;animation:pop .6s}@keyframes pop{from{transform:scale(.3) rotate(-30deg)}}
.otp{display:flex;gap:10px;justify-content:center;margin:20px 0}.otp input{width:52px;height:58px;text-align:center;font-size:24px;border-radius:12px;border:1px solid var(--bd);background:var(--cd)}
.menu{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.av{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;font-weight:700;margin:0 auto 8px;position:relative}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gal div{aspect-ratio:1;border-radius:14px;cursor:pointer}
</style></head><body><div id="app"><div id="scr"></div><nav id="nav"></nav><div id="mod"></div><div id="toast"></div></div>
<script>
const $=id=>document.getElementById(id),fmt=n=>'Rp'+n.toLocaleString('id-ID');
const LOCS=[{id:'A',n:'Terminal Medan Plaza',d:'0,3 km',q:12,p:3000,x:30,y:55,la:3.5897,lo:98.6735},{id:'B',n:'Stasiun Medan',d:'0,9 km',q:0,p:2500,x:68,y:35,la:3.5946,lo:98.6836},{id:'C',n:'Kampus USU Gate 1',d:'1,4 km',q:7,p:2000,x:55,y:80,la:3.5652,lo:98.6567}];
const S={loc:LOCS[0],dur:1,qty:1,gps:null,cam:null,mode:'drop',active:null,user:null,name:'Pengguna',col:'#4338ca',photo:true,tab:'Semua',n:3,filter:false,
hist:[{id:'HLM-240901-0007',t:'Penitipan',st:'Selesai',loc:'Stasiun Medan',dur:2,qty:1,tot:6000,date:'12 Nov 2026, 09:10'},{id:'HLM-240830-0003',t:'Pengembalian',st:'Selesai',loc:'Stasiun Medan',dur:2,qty:1,tot:6000,date:'12 Nov 2026, 11:05'}]};
let cur='home',stack=[],tick=null,sel=null;
const TABS={home:'🏠 Beranda',history:'🕘 Riwayat',acct:'👤 Akun'};
function go(n,reset){clearInterval(tick);if(reset)stack=[];else stack.push(cur);cur=n;draw()}
function back(){clearInterval(tick);cur=stack.pop()||'home';draw()}
function tab(n){go(n==='acct'&&S.user?'profile':n,true)}
function draw(){$('scr').innerHTML=V[cur]();const t=['home','history','acct','profile'].includes(cur);$('nav').style.display=t?'flex':'none';
 const k=cur==='profile'?'acct':cur;$('nav').innerHTML=Object.entries(TABS).map(([a,l])=>`<button class="${a===k?'on':''}" onclick="tab('${a}')"><b>${l.split(' ')[0]}</b>${l.split(' ')[1]}</button>`).join('');$('scr').scrollTop=0;if(I[cur])I[cur]()}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function modal(h){$('mod').innerHTML='<div class="sheet">'+h+'</div>';$('mod').classList.add('on')}
function close(){$('mod').classList.remove('on')}
$('mod').onclick=e=>{if(e.target.id==='mod')close()};
const hd=(t,r='')=>`<div class="hd"><button class="ic" onclick="back()">‹</button><h2>${t}</h2>${r}</div>`;
function qr(seed){let h=7;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;let s='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on;if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)){const a=x>12?x-14:x,b=y>12?y-14:y;on=a>=0&&a<7&&b>=0&&b<7&&(a%6==0||b%6==0||(a>1&&a<5&&b>1&&b<5))}else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1}if(on)s+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`}return`<svg class="qr" viewBox="-1 -1 23 23" fill="currentColor">${s}</svg>`}
const price=()=>{const s=S.loc.p*S.dur*S.qty;return{s,f:1000,t:s+1000}};
const pad=n=>String(n).padStart(2,'0');
function newId(){return'HLM-'+Date.now().toString().slice(-6)+'-'+pad(S.n++)}
function mkTicket(){const p=price();S.active={id:newId(),t:'Penitipan',st:'Aktif',loc:S.loc.n,dur:S.dur,qty:S.qty,tot:p.t,date:new Date().toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),locker:S.loc.id+'-'+pad(5+S.n)};S.hist.unshift(S.active)}
function endTicket(){const a=S.active;a.st='Selesai';S.hist.unshift({...a,id:newId(),t:'Pengembalian',st:'Selesai',date:new Date().toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})});S.last=a;S.active=null}
const copy=id=>{navigator.clipboard&&navigator.clipboard.writeText(id).catch(()=>{});toast('ID transaksi disalin')};
const needGPS=()=>{if(S.gps===true)go('map');else if(S.gps===false)go('gpsOff');else modal(`<div class="ctr"><div class="big">📍</div><h3>Izinkan Akses Lokasi</h3><p class="mu">HelmKu memerlukan GPS untuk menemukan loker terdekat darimu.</p></div><button class="btn" onclick="S.gps=true;close();go('map')">Izinkan GPS</button><button class="lk" onclick="S.gps=false;close();go('gpsOff')">Tolak</button>`)};

const V={
home(){const a=S.active;return`<div class="hero"><small>Halo, ${S.user?S.name:'Tamu'} 👋</small><h1>Titip helm, aman &amp; tanpa ribet</h1><div class="sr" onclick="needGPS()">🔍 Cari lokasi terdekat…</div></div>
${a?`<div class="card" style="border-color:var(--ok)" onclick="go('detail',0);sel=S.active"><span class="bdg">Penitipan Aktif</span><div class="row"><b>${a.loc}</b><span class="mu">Loker ${a.locker||'-'}</span></div><div class="mu sm">${a.qty} helm · ${a.dur} jam · ketuk untuk detail</div></div>`:''}
<div class="row"><b>Lokasi terdekat</b><button class="lk" style="margin:0" onclick="needGPS()">Lihat peta</button></div>
${LOCS.map(l=>`<div class="card" onclick="S.loc=LOCS[${LOCS.indexOf(l)}];needGPS()"><div class="row"><b>${l.n}</b><span class="bdg ${l.q?'':'r'}">${l.q?l.q+' slot':'Penuh'}</span></div><div class="mu sm">${l.d} · ${fmt(l.p)}/jam</div></div>`).join('')}
<button class="btn" onclick="S.mode='drop';go('scanMode')">📷 Scan QR Loker</button>`},
gpsOff(){return`<div class="emp"><div class="big">🛰️</div><h3>GPS Nonaktif</h3><p class="mu">Aktifkan GPS atau cari lokasi secara manual.</p><button class="btn" onclick="S.gps=true;toast('GPS diaktifkan');go('map')">Buka Pengaturan Perangkat</button><input class="in" id="mq" placeholder="Cari lokasi manual (mis. Stasiun)" onkeydown="if(event.key==='Enter')go('map')"><button class="btn sec" onclick="go('map')">Cari</button></div>`},
map(){const l=S.loc;const L=LOCS.filter(x=>!S.filter||x.q>0);return`<div class="hd"><button class="ic" onclick="back()">‹</button><input class="in" style="margin:0" placeholder="Cari lokasi…"><button class="ic" onclick="S.filter=!S.filter;draw()" style="${S.filter?'background:var(--pr);color:#fff':''}">⚙️</button></div>
<div class="mapv"><div class="me" style="left:45%;top:50%"></div>${L.map(x=>`<div class="pin ${x.id===l.id?'on':''}" style="left:${x.x}%;top:${x.y}%" onclick="S.loc=LOCS[${LOCS.indexOf(x)}];draw()">${x.q?'📍':'🚫'}</div>`).join('')}<button class="fab" onclick="toast('Lokasi dipusatkan')">🎯</button></div>
<div class="card" style="margin-top:12px"><div class="row"><b>${l.n}</b><span class="bdg ${l.q?'':'r'}">${l.q?'Kuota '+l.q:'Penuh'}</span></div><div class="mu">Jarak ${l.d} · ${fmt(l.p)}/jam/helm</div><button class="btn" onclick="${l.q?"S.dur=1;S.qty=1;go('booking')":"toast('Lokasi penuh, pilih lokasi lain')"}">Pilih Lokasi Ini</button></div>`},
booking(){const p=price(),l=S.loc;return hd('Booking')+`<div class="card"><b>${l.n}</b><div class="mu sm">${l.d} · Kuota ${l.q} · ${fmt(l.p)}/jam</div></div><b>Durasi</b><div class="chips">${[1,2,3,6,12].map(d=>`<span class="chip ${S.dur===d?'on':''}" onclick="S.dur=${d};draw()">${d} Jam</span>`).join('')}</div>
<div class="card row"><b>Jumlah Helm</b><div><button class="ic" onclick="S.qty=Math.max(1,S.qty-1);draw()">−</button> <b style="padding:0 10px">${S.qty}</b> <button class="ic" onclick="S.qty=Math.min(2,S.qty+1);draw()">+</button></div></div>
<div class="card"><div class="row"><span>Sewa (${S.dur} jam × ${S.qty})</span><span>${fmt(p.s)}</span></div><div class="row"><span>Biaya layanan</span><span>${fmt(p.f)}</span></div><hr style="border:0;border-top:1px solid var(--bd)"><div class="row"><b>Total</b><b>${fmt(p.t)}</b></div></div><button class="btn" onclick="S.left=900;go('qris')">Lanjut ke Pembayaran</button>`},
qris(){return hd('Pembayaran QRIS')+`<div class="card ctr"><div class="mu">Selesaikan dalam</div><div class="tm" id="cd"></div>${qr('QRIS'+price().t)}<div class="mu sm">Total tagihan</div><h2 style="margin:0">${fmt(price().t)}</h2></div><button class="btn sec" onclick="toast('QRIS tersimpan ke galeri')">Unduh QRIS</button><button class="btn" onclick="chk()">Cek Status Pembayaran</button><button class="lk mu" onclick="failPay()">Simulasi: pembayaran gagal</button>`},
ticket(){const a=S.active;return`<div class="ctr"><span class="bdg">Siap Dititipkan</span><h2>Tiket Penitipan</h2></div><div class="card ctr">${qr(a.id)}<b>${a.id}</b><div class="mu sm">Tunjukkan QR ini di loker</div></div><div class="card"><div class="row"><span class="mu">Lokasi</span><b>${a.loc}</b></div><div class="row"><span class="mu">Durasi</span><b>${a.dur} jam</b></div><div class="row"><span class="mu">Helm</span><b>${a.qty}</b></div><div class="row"><span class="mu">Total</span><b>${fmt(a.tot)}</b></div></div><button class="btn" onclick="window.open('https://maps.google.com/?q=${S.loc.la},${S.loc.lo}','_blank')">Petunjuk Arah Maps</button><button class="lk" onclick="go('home',1)">Kembali ke Home</button>`},
scanMode(){return hd('Scan QR')+`<div class="card ctr" onclick="S.mode='drop';scanGo()" style="cursor:pointer"><div class="big">🪖</div><b>Penitipan Helm</b><div class="mu sm">Scan loker kosong untuk menitipkan</div></div><div class="card ctr" onclick="S.mode='ret';scanGo()" style="cursor:pointer"><div class="big">📤</div><b>Pengembalian Helm</b><div class="mu sm">Scan loker untuk mengambil helm</div></div>`},
camOff(){return`<div class="emp"><div class="big">📵</div><h3>Kamera Nonaktif</h3><p class="mu">Izinkan akses kamera untuk memindai QR loker.</p><button class="btn" onclick="S.cam=true;toast('Izin kamera diaktifkan');go('scan')">Buka Pengaturan Izin Kamera</button><button class="lk" onclick="back()">Kembali</button></div>`},
scan(){return`<div class="hd"><button class="ic" onclick="back()">‹</button><h2>${S.mode==='drop'?'Scan Loker Penitipan':'Scan Pengembalian'}</h2><button class="ic" id="fl" onclick="this.style.background=this.style.background?'':'#fde047'">🔦</button></div><div class="cam"><div class="vf"><i></i></div><div style="position:absolute;bottom:12px;font-size:12px;opacity:.8">Arahkan kamera ke QR loker…</div></div><button class="lk" onclick="manual()">Input Kode Loker Manual</button>
<div class="card"><div class="mu sm">Simulasi hasil scan:</div><button class="btn" onclick="scanOK()">✅ Scan QR valid</button><button class="btn sec" onclick="scanErr()">⚠️ ${S.mode==='drop'?'Loker penuh':'QR tidak cocok'}</button></div>`},
lockerDetail(){const p=price(),l=S.loc;return hd('Detail Loker')+`<div class="card"><div class="row"><b>Loker ${l.id}-${pad(5+S.n)}</b><span class="bdg">Tersedia</span></div><div class="mu sm">${l.n}</div></div><b>Durasi</b><div class="chips">${[1,2,3,6].map(d=>`<span class="chip ${S.dur===d?'on':''}" onclick="S.dur=${d};draw()">${d} Jam</span>`).join('')}</div><div class="card"><div class="row"><span>${S.qty} helm × ${S.dur} jam</span><span>${fmt(p.s)}</span></div><div class="row"><span>Biaya layanan</span><span>${fmt(p.f)}</span></div><div class="row"><b>Total</b><b>${fmt(p.t)}</b></div></div><button class="btn" onclick="toast('Memproses pembayaran…');setTimeout(()=>{mkTicket();go('openDrop')},900)">Konfirmasi &amp; Lakukan Pembayaran</button>`},
openDrop(){return`<div class="emp"><div class="lock">🔓</div><h2>Loker Terbuka</h2><p class="mu">Masukkan helm ke dalam loker lalu tutup pintunya.</p><button class="btn" onclick="go('dropOK',1)">Selesai / Loker Tertutup</button></div>`},
dropOK(){const a=S.active;return`<div class="emp"><div class="big">✅</div><span class="bdg">Berhasil Dititipkan</span><h2>Helm Aman!</h2></div><div class="card"><span class="bdg a">Tiket Aktif</span><div class="row"><b>${a.loc}</b><span>${a.locker}</span></div><div class="mu sm">${a.id} · ${a.dur} jam</div></div><button class="btn" onclick="go('home',1)">Kembali ke Beranda</button>`},
openRet(){return`<div class="emp"><div class="lock">🔓</div><h2>Loker Terbuka</h2><p class="mu">Ambil helm kamu lalu tutup kembali loker.</p><button class="btn" onclick="endTicket();go('retOK',1)">Konfirmasi Helm Diambil</button></div>`},
retOK(){const a=S.last;return`<div class="emp"><div class="big">🎉</div><span class="bdg">Pengembalian Berhasil</span><h2>Terima kasih!</h2></div><div class="card"><div class="row"><span class="mu">Lokasi</span><b>${a.loc}</b></div><div class="row"><span class="mu">Durasi</span><b>${a.dur} jam</b></div><div class="row"><span class="mu">Total</span><b>${fmt(a.tot)}</b></div></div><button class="btn" onclick="go('home',1)">Selesai / Beranda</button><button class="lk" onclick="toast('Terima kasih atas masukanmu!')">Beri Ulasan / Lapor Masalah</button>`},
history(){const q=(S.q||'').toLowerCase(),L=S.hist.filter(h=>(S.tab==='Semua'||h.t===S.tab)&&(h.loc+h.id).toLowerCase().includes(q));
return`<div class="hd"><h2>Riwayat</h2><button class="ic" onclick="S.sq=!S.sq;S.q='';draw()">🔍</button></div>${S.sq?`<input class="in" style="margin:0 0 10px" placeholder="Cari transaksi…" value="${S.q||''}" oninput="S.q=this.value;sh()">`:''}<div class="chips">${['Semua','Penitipan','Pengembalian'].map(t=>`<span class="chip ${S.tab===t?'on':''}" onclick="S.tab='${t}';draw()">${t}</span>`).join('')}</div><div id="hl">${hl(L)}</div>`},
detail(){const a=sel;return hd('Detail Transaksi','<button class="ic" onclick="toast(\'Tautan dibagikan\')">↗</button>')+`<div class="card"><span class="bdg ${a.st==='Aktif'?'a':''}">${a.st}</span> <button class="lk" style="display:inline;margin:0 0 0 8px" onclick="copy('${a.id}')">Copy ID</button><div class="sm mu" style="margin-top:6px">${a.id}</div></div><div class="card"><b>Loker &amp; Waktu</b><div class="row"><span class="mu">Lokasi</span>${a.loc}</div><div class="row"><span class="mu">Tanggal</span>${a.date}</div><div class="row"><span class="mu">Durasi</span>${a.dur} jam</div></div><div class="card"><b>Rincian Pembayaran</b><div class="row"><span>Sewa</span>${fmt(a.tot-1000)}</div><div class="row"><span>Layanan</span>${fmt(1000)}</div><div class="row"><b>Total</b><b>${fmt(a.tot)}</b></div></div><button class="btn sec" onclick="toast('Struk diunduh')">Unduh Struk</button>${a.st==='Aktif'?`<button class="btn" onclick="S.mode='ret';scanGo()">Buka Loker</button>`:''}<button class="lk" onclick="toast('Menghubungkan ke CS…')">Butuh Bantuan?</button>`},
acct(){return`<div class="emp"><div class="big">🪖</div><h2>HelmKu</h2><p class="mu">Masuk untuk menyimpan riwayat dan tiket penitipanmu.</p><button class="btn" onclick="go('signin')">Sign In</button><button class="btn sec" onclick="go('signup')">Sign Up</button></div>`},
signup(){return hd('Sign Up')+form('Daftar Akun',[['e','Email / No. HP','text'],['p','Password','password']],'Kirim Kode','doSignup()','Sudah punya akun? Sign In',"go('signin')")},
signin(){return hd('Sign In')+form('Masuk',[['e','Email / No. HP','text'],['p','Password','password']],'Sign In','doSignin()','Belum punya akun? Sign Up',"go('signup')",'<button class="lk" style="margin:4px 0 0;text-align:right;display:block;margin-left:auto" onclick="go(\'otp\');S.ctx=\'reset\'">Reset Password</button>')},
otp(){return hd('Verifikasi')+`<div class="ctr"><h3>Masukkan Kode Verifikasi</h3><p class="mu">Kode 4 digit dikirim ke kontakmu (demo: isi angka apa saja).</p></div><div class="otp">${[0,1,2,3].map(i=>`<input maxlength="1" inputmode="numeric" data-i="${i}">`).join('')}</div><div class="ctr mu" id="otpt"></div><div class="err ctr" id="er"></div><button class="btn" onclick="doOtp()">Verifikasi</button>`},
reset(){return hd('Reset Password')+form('Password Baru',[['e','Email / No. HP','text'],['p','Password Baru','password'],['c','Konfirmasi Password','password']],'Simpan Password Baru','doReset()')},
profile(){return`<div class="ctr"><div class="av" style="background:${S.col}">${S.photo?S.name[0].toUpperCase():'👤'}<button class="ic" style="position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;font-size:13px" onclick="photoMod()">✏️</button></div><h2 style="margin:4px 0">${S.name} <button class="ic" style="width:28px;height:28px;font-size:12px" onclick="go('name')">✏️</button></h2><div class="mu sm">${S.user}</div></div><div class="card" style="margin-top:16px"><div class="menu" onclick="photoMod()"><span>Edit Photo Profile</span>›</div><div class="menu" onclick="go('name')"><span>Edit Display Name</span>›</div><div class="menu" style="color:var(--er);border:0" onclick="outMod()"><span>Keluar / Hapus Akun</span>›</div></div>`},
gallery(){return hd('Pilih dari Gallery')+`<div class="gal">${['#4338ca','#db2777','#059669','#d97706','#0891b2','#7c3aed'].map(c=>`<div style="background:${c}" onclick="S.col='${c}';S.photo=true;toast('Foto diperbarui');stack=[];go('profile',1)"></div>`).join('')}</div>`},
name(){return hd('Display Name')+`<input class="in" id="nn" value="${S.name}" maxlength="24" placeholder="Display name baru"><div class="err" id="er"></div><button class="btn" onclick="const v=$('nn').value.trim();if(!v)return $('er').textContent='Nama tidak boleh kosong';S.name=v;toast('Nama disimpan');back()">Simpan</button>`}
};
const I={qris(){const t=()=>{S.left--;const e=$('cd');if(!e)return clearInterval(tick);if(S.left<=0){clearInterval(tick);return failPay()}e.textContent=pad(Math.floor(S.left/60))+':'+pad(S.left%60)};t();tick=setInterval(t,1000)},
otp(){let b=[...document.querySelectorAll('.otp input')];b[0].focus();b.forEach((x,i)=>{x.oninput=()=>{x.value=x.value.replace(/\D/g,'');if(x.value&&b[i+1])b[i+1].focus()};x.onkeydown=e=>{if(e.key==='Backspace'&&!x.value&&b[i-1])b[i-1].focus()}});S.left=30;const t=()=>{const e=$('otpt');if(!e)return clearInterval(tick);e.innerHTML=S.left>0?`Kirim ulang dalam 0:${pad(S.left)}`:'<button class="lk" onclick="S.left=30;toast(\'Kode dikirim ulang\')">Kirim Ulang Kode</button>';if(S.left>0)S.left--};t();tick=setInterval(t,1000)}};
function chk(){toast('Memeriksa pembayaran…');setTimeout(()=>{mkTicket();go('ticket',1)},900)}
function failPay(){modal(`<div class="ctr"><div class="big">❌</div><h3>Pembayaran Gagal</h3><p class="mu">Pembayaran tidak dapat diproses atau waktu habis.</p></div><button class="btn" onclick="close();S.left=900;draw()">Pembayaran Ulang</button>`)}
function scanGo(){if(S.cam===true)go('scan');else if(S.cam===false)go('camOff');else modal(`<div class="ctr"><div class="big">📷</div><h3>Izinkan Kamera</h3><p class="mu">Kamera dibutuhkan untuk memindai QR loker.</p></div><button class="btn" onclick="S.cam=true;close();go('scan')">Izinkan</button><button class="lk" onclick="S.cam=false;close();go('camOff')">Tolak</button>`)}
function scanOK(){if(S.mode==='drop'){S.loc=S.loc||LOCS[0];go('lockerDetail')}else if(S.active)go('openRet');else scanErr()}
function scanErr(){S.mode==='drop'?modal(`<div class="ctr"><div class="big">🚫</div><h3>Loker Penuh</h3><p class="mu">Loker ini sedang terisi. Silakan scan loker lain.</p></div><button class="btn" onclick="close()">Scan Loker Lain</button>`):modal(`<div class="ctr"><div class="big">⛔</div><h3>Akses Ditolak</h3><p class="mu">QR tidak cocok dengan transaksi aktif milikmu.</p></div><button class="btn" onclick="close()">Periksa Kembali QR / Transaksi</button>`)}
function manual(){modal(`<h3>Input Kode Loker</h3><input class="in" id="mc" placeholder="Mis. A-12"><button class="btn" onclick="if($('mc').value.trim()){close();scanOK()}else toast('Isi kode loker')">Lanjut</button>`)}
function hl(L){return L.length?L.map(h=>`<div class="card" onclick="sel=S.hist.find(x=>x.id==='${h.id}');go('detail')" style="cursor:pointer"><div class="row"><b>${h.t}</b><span class="bdg ${h.st==='Aktif'?'a':''}">${h.st}</span></div><div>${h.loc}</div><div class="mu sm">${h.date} · ${fmt(h.tot)}</div></div>`).join(''):`<div class="emp"><div class="big">🗂️</div><p class="mu">Belum ada transaksi.</p><button class="btn" onclick="go('home',1)">Mulai Titip Helm</button></div>`}
function sh(){const q=S.q.toLowerCase();$('hl').innerHTML=hl(S.hist.filter(h=>(S.tab==='Semua'||h.t===S.tab)&&(h.loc+h.id).toLowerCase().includes(q)))}
function form(t,f,btn,fn,lk,lf,extra=''){return`<h2>${t}</h2>${f.map(([k,p,ty])=>`<div style="position:relative"><input class="in" id="f_${k}" type="${ty}" placeholder="${p}" autocomplete="off">${ty==='password'?`<button class="ic" style="position:absolute;right:6px;top:14px;width:32px;height:32px;border:0" onclick="const i=$('f_${k}');i.type=i.type==='password'?'text':'password'">👁</button>`:''}</div>`).join('')}${extra}<div class="err" id="er"></div><button class="btn" onclick="${fn}">${btn}</button>${lk?`<button class="lk" onclick="${lf}">${lk}</button>`:''}`}
const val=k=>($('f_'+k)||{}).value||'';
function doSignup(){const e=val('e').trim(),p=val('p');if(!e)return $('er').textContent='Email / No. HP wajib diisi';if(p.length<6)return $('er').textContent='Password minimal 6 karakter';S.tmp=e;S.ctx='signup';go('otp')}
function doOtp(){const v=[...document.querySelectorAll('.otp input')].map(x=>x.value).join('');if(v.length<4)return $('er').textContent='Masukkan 4 digit kode';if(S.ctx==='reset')return go('reset');S.user=S.tmp;S.name='Pengguna';toast('Akun berhasil dibuat');stack=[];go('profile',1)}
function doSignin(){const e=val('e').trim(),p=val('p');if(!e||!p)return $('er').textContent='Email/No. HP dan password wajib diisi';S.user=e;S.name=e.split('@')[0].slice(0,14)||'Pengguna';toast('Berhasil masuk');go('profile',1)}
function doReset(){const p=val('p'),c=val('c');if(!val('e').trim()||p.length<6)return $('er').textContent='Lengkapi data (password min. 6 karakter)';if(p!==c)return $('er').textContent='Konfirmasi password tidak sama';toast('Password diperbarui');go('signin',1)}
function photoMod(){modal(`<h3>Edit Foto Profil</h3><button class="btn" onclick="close();go('gallery')">Pilih dari Gallery</button><button class="btn dg" onclick="S.photo=false;close();toast('Foto dihapus');draw()">Delete Photo</button><button class="lk" onclick="close()">Batal</button>`)}
function outMod(){modal(`<h3>Keluar / Hapus Akun</h3><button class="btn sec" onclick="close();S.user=null;toast('Berhasil keluar');go('acct',1)">Keluar / Log Out</button><button class="btn dg" onclick="delMod()">Hapus Akun</button><button class="lk" onclick="close()">Batal</button>`)}
function delMod(){modal(`<h3 style="color:var(--er)">Hapus Akun</h3><p class="mu">Tindakan ini permanen. Masukkan password untuk konfirmasi.</p><input class="in" id="dp" type="password" placeholder="Password konfirmasi"><div class="err" id="de"></div><button class="lk" onclick="close();S.ctx='reset';go('otp')">Lupa Password?</button><button class="btn dg" onclick="if(!$('dp').value)return $('de').textContent='Password wajib diisi';close();S.user=null;S.hist=[];S.active=null;toast('Akun dihapus');go('acct',1)">Konfirmasi Hapus Akun</button>`)}
draw();
</script></body></html>
